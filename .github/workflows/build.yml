name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build (warnings are failures)
        run: dotnet build VoltPulse.sln -c Release --nologo /clp:"ErrorsOnly;WarningsOnly"

      - name: Test
        run: dotnet test VoltPulse.sln -c Release --no-build --nologo

      - name: Publish win-x64
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet publish src/VoltPulse.App/VoltPulse.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o dist/win-x64

      - name: Publish win-arm64
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet publish src/VoltPulse.App/VoltPulse.App.csproj -c Release -r win-arm64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o dist/win-arm64

      - name: Package portable zip
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = "${env:GITHUB_REF_NAME}".TrimStart("v")
          Compress-Archive -Path "dist/win-x64/*" -DestinationPath "dist/VoltPulse-$v-portable-win-x64.zip"
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Flatten release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cd dist
          cp win-x64/VoltPulse.exe "VoltPulse-${GITHUB_REF_NAME#v}-win-x64.exe"
          cp win-arm64/VoltPulse.exe "VoltPulse-${GITHUB_REF_NAME#v}-win-arm64.exe"

      - name: Hashes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cd dist
          sha256sum VoltPulse-*.zip VoltPulse-*-win-x64.exe VoltPulse-*-win-arm64.exe > SHA256SUMS.txt

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS="dist/VoltPulse-*.zip dist/VoltPulse-*-win-x64.exe dist/VoltPulse-*-win-arm64.exe dist/SHA256SUMS.txt"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" ${ASSETS} --clobber
          else
            gh release create "${GITHUB_REF_NAME}" ${ASSETS} \
              --title "VoltPulse ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi
